name: Build

on:
  push:
    branches: [ "FG_6.0", "main" ]
  pull_request:
    branches: [ "FG_6.0", "main" ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build publishToMavenLocal -x createChangelog

    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        cp ~/.m2/repository/net/minecraftforge/gradle/ForgeGradle/*/ForgeGradle-*.jar artifacts/ 2>/dev/null || true
        cp ~/.m2/repository/net/minecraftforge/gradle/ForgeGradle/*/ForgeGradle-*.pom artifacts/ 2>/dev/null || true
        cp ~/.m2/repository/net/minecraftforge/gradle/ForgeGradle/*/ForgeGradle-*.module artifacts/ 2>/dev/null || true
        ls -la artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ForgeGradle
        path: artifacts/

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
